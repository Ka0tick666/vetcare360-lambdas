
name: CI/CD VetCare360 Lambdas

on:
  push:
    branches:
      - main
    paths:
      - 'informes-registro/**'
      - 'informes-notificacion/**'
      - 'logs-dynamodb/**'
      - '.github/workflows/deploy-lambdas.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vetcare360-lambdas
  cancel-in-progress: false

jobs:

  build:
    name: Validar y empaquetar Lambdas
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lambda:
          - informes-registro
          - informes-notificacion
          - logs-dynamodb

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        working-directory: ${{ matrix.lambda }}
        run: npm ci --omit=dev

      - name: Validar sintaxis
        working-directory: ${{ matrix.lambda }}
        run: |
          test -s index.mjs
          node --check index.mjs

      - name: Generar ZIP
        working-directory: ${{ matrix.lambda }}
        run: |
          zip -qr ../${{ matrix.lambda }}.zip \
            index.mjs package.json package-lock.json node_modules

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lambda }}
          path: ${{ matrix.lambda }}.zip
          retention-days: 7

  deploy:
    name: Desplegar Lambdas en AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        lambda:
          - informes-registro
          - informes-notificacion
          - logs-dynamodb

    steps:

      - name: Descargar ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.lambda }}

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Desplegar Lambda
        run: |
          aws lambda update-function-code \
            --function-name vetcare360-${{ matrix.lambda }} \
            --zip-file fileb://${{ matrix.lambda }}.zip \
            --query '{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus}'

      - name: Verificar despliegue
        run: |
          aws lambda wait function-updated \
            --function-name vetcare360-${{ matrix.lambda }}

          echo "Lambda desplegada correctamente"

